<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — ShopKhata 🏪</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5.3 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />

  <style>
    body {
      background: linear-gradient(135deg, #198754 0%, #0f5132 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .login-card {
      border: none;
      border-radius: 1rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 420px;
      width: 100%;
    }
    .login-logo {
      font-size: 3rem;
      line-height: 1;
    }
    .login-title {
      color: #198754;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container px-3">

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <div class="mb-3" style="max-width:420px; margin:0 auto;">
        {% for category, message in messages %}
        <div class="alert alert-{{ 'success' if category == 'success' else 'danger' if category == 'danger' else 'warning' if category == 'warning' else 'info' }} alert-dismissible fade show shadow-sm" role="alert" data-auto-dismiss>
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
      </div>
      {% endif %}
    {% endwith %}

    <div class="card login-card mx-auto">
      <div class="card-body p-4 p-md-5">
        <!-- Logo & Title -->
        <div class="text-center mb-4">
          <div class="login-logo mb-2">🏪</div>
          <h2 class="login-title">ShopKhata</h2>
          <p class="text-muted small">Shop Credit & Ledger Tracker</p>
        </div>

        <!-- Login Form -->
        <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

          <div class="mb-3">
            <label for="username" class="form-label fw-500">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0">
                <i class="bi bi-person text-muted"></i>
              </span>
              <input
                type="text"
                id="username"
                name="username"
                class="form-control border-start-0"
                placeholder="Enter username"
                autocomplete="username"
                required
                autofocus
              />
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-500">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0">
                <i class="bi bi-lock text-muted"></i>
              </span>
              <input
                type="password"
                id="password"
                name="password"
                class="form-control border-start-0"
                placeholder="Enter password"
                autocomplete="current-password"
                required
              />
              <button class="btn btn-outline-secondary" type="button" id="togglePassword" tabindex="-1" aria-label="Show password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-success btn-lg fw-600">
              <i class="bi bi-box-arrow-in-right me-2"></i>Login
            </button>
          </div>
        </form>

        <!-- Demo Credentials Hint -->
        <div class="alert alert-light border text-center small mb-0 mt-2">
          <i class="bi bi-info-circle text-primary me-1"></i>
          <strong>Demo:</strong> username&nbsp;=&nbsp;<code>demo</code>&nbsp;&nbsp;password&nbsp;=&nbsp;<code>demo123</code>
        </div>
      </div>
    </div>

    <p class="text-center text-white-50 mt-4 small">&copy; 2024 ShopKhata</p>
  </div>

  <!-- Bootstrap JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmFF5mH6W0BDDG29HqTE9WEolfoI" crossorigin="anonymous"></script>
  <script>
    // Toggle password visibility
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    if (togglePassword) {
      togglePassword.addEventListener('click', () => {
        const isText = passwordInput.type === 'text';
        passwordInput.type = isText ? 'password' : 'text';
        togglePassword.querySelector('i').className = isText ? 'bi bi-eye' : 'bi bi-eye-slash';
      });
    }
    // Auto-dismiss alerts
    setTimeout(() => {
      document.querySelectorAll('[data-auto-dismiss]').forEach(el => {
        const bsAlert = bootstrap.Alert.getOrCreateInstance(el);
        bsAlert.close();
      });
    }, 4000);
  </script>
</body>
</html>
